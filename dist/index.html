<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>OpenStarbound</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: none;
      }

      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; }      
      div.emscripten_border { border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; }

      #emscripten_logo {
        display: inline-block;
        margin: 0;
      }

      .spinner {
        height: 30px;
        width: 30px;
        margin: 0;
        margin-top: 20px;
        margin-left: 20px;
        display: inline-block;
        vertical-align: top;

        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border-left: 5px solid rgb(235, 235, 235);
        border-right: 5px solid rgb(235, 235, 235);
        border-bottom: 5px solid rgb(235, 235, 235);
        border-top: 5px solid rgb(120, 120, 120);
        
        border-radius: 100%;
        background-color: rgb(189, 215, 46);
      }

      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

      #status {
        display: inline-block;
        vertical-align: top;
        margin-top: 30px;
        margin-left: 20px;
        font-weight: bold;
        color: rgb(120, 120, 120);
      }

      #progress {
        height: 20px;
        width: 300px;
      }

      #controls {
        display: inline-block;
        float: right;
        vertical-align: top;
        margin-top: 30px;
        margin-right: 20px;
      }

      #output {
        width: 100%;
        height: 200px;
        margin: 0 auto;
        margin-top: 10px;
        border-left: 0px;
        border-right: 0px;
        padding-left: 0px;
        padding-right: 0px;
        display: block;
        background-color: black;
        color: white;
        font-family: 'Lucida Console', Monaco, monospace;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="spinner" id='spinner'></div>
    <div class="emscripten" id="status">Downloading...</div>

<span id='controls'>
  <span><input type="checkbox" id="resize">Resize canvas</span>
  <span><input type="checkbox" id="pointerLock">Lock/hide mouse pointer</span>
  <span><input id="fullscreen" type="button" value="Fullscreen" disabled>
  </span>
  <span><input id="start1" type="button" value="Start with mods" disabled></span>
  <span><input id="start2" type="button" value="Start without mods" disabled></span>
  <span><input id="loadmods" type="button" value="Change mods folder"></span>
</span>

    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>

    
    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>

    <script type="module">
      import { get, set } from './idb-keyval.js';
      import { FsaFS } from './fsafs.js';
      import loadWASM from './starbound.js';

      // Prevent bugs related to changes in Window size
      window.addEventListener("resize", e => {
        e.detail ??= 0;
      });

      const statusElement = document.getElementById('status');
      const progressElement = document.getElementById('progress');
      const spinnerElement = document.getElementById('spinner');
      const startWithModsElement = document.getElementById('start1');
      const startWithoutModsElement = document.getElementById('start2');
      const loadModsElement = document.getElementById('loadmods');
      const fullscreenElement = document.getElementById('fullscreen');

      async function loadMods(mods) {
        if (!mods) return;
        const promises = [];
        for await (const entry of mods.values()) {
          if (entry.kind !== 'file' || !entry.name.endsWith('.pak')) {
            continue;
          }
          promises.push(entry.getFile());
        }
        return Promise.all(promises);
      }

      async function verifyModsFolderPermission(fileHandle) {
        // Check if permission was already granted. If so, return true.
        if ((await fileHandle.queryPermission()) === 'granted') {
          return true;
        }
        // Request permission. If the user grants permission, return true.
        if ((await fileHandle.requestPermission()) === 'granted') {
          return true;
        }
        // The user didn't grant permission, so return false.
        return false;
      }

      async function getModsFolder() {
        const mods = await get('directory');
        if (mods && await verifyModsFolderPermission(mods)) {
          return mods;
        }
        return null;
      }

      async function setModsFolder() {
        const directoryHandle = await window.showDirectoryPicker();
        await set('directory', directoryHandle);
        return directoryHandle;
      }

      const Module = {
        noInitialRun: true,
        preRun: [async () => {
        }],
        onRuntimeInitialized() {
          startWithModsElement.removeAttribute('disabled');
          startWithoutModsElement.removeAttribute('disabled');
        },
        postRun: [],
        print: console.log,
        canvas: (() => {
          const canvas = document.getElementById('canvas');
          canvas.widthNative = screen.width;
          canvas.heightNative = screen.height;

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          canvas.addEventListener("webglcontextlost", (e) => { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

          return canvas;
        })(),
        setStatus(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          const now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = (event) => {
        // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };

      loadWASM(Module).then(m => {
        const fsafs = new FsaFS(m);
        // Used from CXX code
        globalThis.persistfs = fsafs.persistfs.bind(fsafs);

        async function start(withMods) {
          startWithModsElement.setAttribute('disabled', '');
          startWithoutModsElement.setAttribute('disabled', '');
          if (withMods) {
            const mods = await getModsFolder();
            const files = await loadMods(mods);
            await fsafs.setMods(files);
          }

          fullscreenElement.removeAttribute('disabled');
          try {
            m.callMain();
          } catch (e) {
            console.error(e);
            fullscreenElement.setAttribute('disabled', '');
            startWithModsElement.removeAttribute('disabled');
            startWithoutModsElement.removeAttribute('disabled');
          }
        }

        startWithModsElement.onclick = () => start(true);
        startWithoutModsElement.onclick = () => start(false);
        loadModsElement.onclick = setModsFolder;
        fullscreenElement.onclick = () => {
          m.requestFullscreen(
            document.getElementById('pointerLock').checked,
            document.getElementById('resize').checked
          );
        }
      });
    </script>
  </body>
</html>
